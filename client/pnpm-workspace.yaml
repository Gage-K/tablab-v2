# Build-script approvals. esbuild ships a platform binary via its install
# script and is needed by vite; msw's postinstall is not needed here.
allowBuilds:
  esbuild: true
  msw: false

# Transitive-dependency security patches (see Dependabot alerts).
# Direct deps (axios, react-router, nanoid, vite) are pinned in package.json.
# Range-keyed entries pin only the vulnerable versions, leaving other majors alone.
overrides:
  "@babel/core": ">=7.29.1"
  "@hono/node-server": ">=1.19.15"
  "body-parser": ">=2.3.0"
  "brace-expansion@>=1.0.0 <1.1.18": "1.1.18"
  "brace-expansion@>=3.0.0 <5.0.9": "5.0.9"
  "fast-uri": ">=3.1.5"
  "form-data": ">=4.0.6"
  "hono": ">=4.12.34"
  "ip-address": ">=10.3.1"
  "js-yaml@4": ">=4.3.1"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "5.1.16"
  "postcss": ">=8.5.23"
  "qs": ">=6.15.2"
