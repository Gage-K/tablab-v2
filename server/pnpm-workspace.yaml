# Approve native-binary build scripts for trusted tooling (esbuild ships a
# platform binary via its install script; vite/vitest need it at runtime).
allowBuilds:
  esbuild: true

# Transitive-dependency security patches (see Dependabot alerts).
# Range-keyed entries pin only the vulnerable versions, leaving other majors alone.
overrides:
  "body-parser": ">=2.3.0"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=3.0.0 <5.0.9": "5.0.9"
  "esbuild": ">=0.28.1"
  "form-data": ">=4.0.6"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "postcss": ">=8.5.23"
  "qs": ">=6.15.2"
  "vite@>=7.0.0 <7.3.5": "7.3.5"
